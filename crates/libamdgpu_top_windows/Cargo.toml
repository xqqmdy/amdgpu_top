[package]
name = "libamdgpu_top_windows"
license = "MIT"
description = "Windows backend for amdgpu_top: per-process GPU engine utilization and memory via DXGI/PDH (Task Manager data sources)"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true

# Windows only. This crate is a P0 port of amdgpu_top's stat layer:
#   DevicePath  -> DXGI adapter enumeration (vendor 0x1002)
#   FdInfoUsage -> PDH "GPU Engine" (per-process per-engine utilization %)
#               -> PDH "GPU Process Memory" (per-process dedicated/shared KB)
#   VramUsage   -> DXGI_ADAPTER_DESC1 memory totals

[[bin]]
name = "amdgpu_top_win"
path = "src/main.rs"

[features]
default = []
# ADLX sensor backend (temperature/clock/fan/power/VRAM usage).
# Requires a local clone of GPUOpen-LibrariesAndSDKs/ADLX next to this repo
# (../../../ADLX relative to this crate) and the AMD driver's amdadlx64.dll.
adlx = ["dep:amd-adlx"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_ToolHelp",
] }
amd-adlx = { path = "../../../ADLX/Samples/rust/amd-adlx", optional = true }
